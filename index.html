const L="ABCD",A=document.getElementById("a"),K="simpool1";
let T=[],i=0,sel=null;
function ld(){try{return JSON.parse(localStorage.getItem(K))||{u:[],n:0}}catch(e){return{u:[],n:0}}}
function sv(s){try{localStorage.setItem(K,JSON.stringify(s))}catch(e){}}
function sh(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function build(){const s=ld(),N=Q.length,n=Math.min(50,N),al=[...Array(N).keys()];let u=s.u.filter(x=>x<N),f=sh(al.filter(x=>!u.includes(x))),ids;
if(f.length>=n){ids=f.slice(0,n);u=u.concat(ids)}else{ids=f.concat(sh(al.filter(x=>!f.includes(x))).slice(0,n-f.length));u=ids.slice()}
sv({u:u,n:s.n+1});
return sh(ids).map(id=>{const q=Q[id],o=q[1].split("|"),c=o[q[2]],p=sh(o);return{q:q[0],o:p,a:p.indexOf(c),e:q[3],r:null}})}
function start(){const s=ld();A.innerHTML=`<div class="hd"><h1>🩺 Simulado de Pediatria</h1><p>Tentativa nº ${s.n+1}</p></div><div class="c">Cada tentativa sorteia <b>50 questões difíceis</b> de um banco de <b>${Q.length}</b>. Nenhuma se repete até o banco acabar. No final, você vê apenas a correção das questões que errou.</div><button class="p" onclick="go()">Começar</button>`}
function go(){T=build();i=0;show()}
function show(){sel=null;const q=T[i];A.innerHTML=`<div class="meta"><span>Questão ${i+1} de ${T.length}</span><span>${Math.round(i/T.length*100)}%</span></div><div class="bar"><i style="width:${i/T.length*100}%"></i></div><div class="c"><b>${q.q}</b>${q.o.map((t,k)=>`<button id="o${k}" onclick="pick(${k})"><span class="k">${L[k]}</span><span>${t}</span></button>`).join("")}</div><button class="p" id="n" onclick="nx()" disabled>${i==T.length-1?"Finalizar":"Próxima"}</button>`}
function pick(k){sel=k;for(let j=0;j<T[i].o.length;j++)document.getElementById("o"+j).className=j==k?"s":"";document.getElementById("n").disabled=false}
function nx(){T[i].r=sel;i++;i<T.length?show():fim()}
function fim(){const w=T.filter(x=>x.r!=x.a),h=T.length-w.length,pc=Math.round(h/T.length*100);
A.innerHTML=`<div class="hd"><h1>Resultado</h1></div><div class="c"><div class="ring" style="background:conic-gradient(var(--ok) ${pc}%,var(--nob) 0)"><b>${pc}%</b></div><div class="st"><div class="a"><b>${h}</b><br><small>Acertos</small></div><div class="e"><b>${w.length}</b><br><small>Erros</small></div></div></div><h2>${w.length?"Correção das questões erradas":"🎉 Você acertou tudo!"}</h2>`+w.map(x=>`<div class="c er"><b>${x.q}</b><br><br>Sua resposta: <span class="no">${L[x.r]}) ${x.o[x.r]}</span><br>Correta: <span class="ok">${L[x.a]}) ${x.o[x.a]}</span><br><br><span class="no"><b>Por que está errado:</b></span> a alternativa ${L[x.r]} não corresponde ao conteúdo da aula.<br><span class="ok"><b>Explicação correta:</b></span> ${x.e}</div>`).join("")+`<button class="p" onclick="start()">Nova tentativa</button>`}
start();
